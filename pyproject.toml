[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-lab"
version = "0.1.0"
description = "Synthetic market data API for batch and streaming pipeline experiments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]